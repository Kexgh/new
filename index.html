<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal Portfolio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020403;
      --panel: #061009;
      --green: #32ff75;
      --green-dim: #12a14a;
      --green-soft: rgba(50, 255, 117, 0.14);
      --amber: #ffd166;
      --red: #ff5c5c;
      --font: "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 40%, rgba(31, 95, 45, 0.14), transparent 44%),
        linear-gradient(180deg, #000 0%, var(--bg) 100%);
      color: var(--green);
      font-family: var(--font);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.05) 0,
          rgba(255, 255, 255, 0.05) 1px,
          transparent 1px,
          transparent 4px
        );
      mix-blend-mode: screen;
      opacity: 0.16;
      z-index: 5;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.72) 100%);
      z-index: 6;
    }

    .terminal-shell {
      width: min(980px, calc(100vw - 32px));
      height: min(680px, calc(100vh - 32px));
      min-height: 460px;
      position: relative;
      border: 2px solid var(--green-dim);
      background: rgba(2, 9, 4, 0.94);
      box-shadow:
        0 0 0 4px rgba(0, 0, 0, 0.75),
        0 0 32px rgba(50, 255, 117, 0.28),
        inset 0 0 42px rgba(18, 161, 74, 0.18);
      isolation: isolate;
    }

    .terminal-shell::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(50, 255, 117, 0.22);
      pointer-events: none;
    }

    .terminal-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 42px;
      padding: 0 18px;
      border-bottom: 1px solid var(--green-dim);
      background: linear-gradient(180deg, rgba(21, 67, 31, 0.52), rgba(6, 16, 9, 0.76));
      letter-spacing: 0;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(50, 255, 117, 0.72);
    }

    .status-lights {
      display: flex;
      gap: 8px;
    }

    .status-lights span {
      width: 10px;
      height: 10px;
      border: 1px solid var(--green);
      background: var(--green-soft);
      box-shadow: 0 0 10px rgba(50, 255, 117, 0.5);
    }

    .terminal {
      height: calc(100% - 42px);
      padding: 22px;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--green-dim) transparent;
      text-shadow: 0 0 8px rgba(50, 255, 117, 0.74);
      font-size: clamp(15px, 1.8vw, 18px);
      line-height: 1.48;
    }

    .terminal::-webkit-scrollbar {
      width: 10px;
    }

    .terminal::-webkit-scrollbar-thumb {
      background: var(--green-dim);
    }

    .line {
      min-height: 1.48em;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .dim {
      color: #1ecb5b;
      opacity: 0.78;
    }

    .amber {
      color: var(--amber);
      text-shadow: 0 0 8px rgba(255, 209, 102, 0.44);
    }

    .error {
      color: var(--red);
      text-shadow: 0 0 8px rgba(255, 92, 92, 0.5);
    }

    .files {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 4px 18px;
      max-width: 650px;
      margin: 6px 0 10px;
    }

    .prompt-row {
      display: flex;
      align-items: baseline;
      min-height: 1.48em;
    }

    .prompt {
      flex: 0 0 auto;
      color: var(--green);
    }

    .command-input {
      position: relative;
      flex: 1 1 auto;
      min-width: 1ch;
      padding-left: 1ch;
      outline: none;
      caret-color: transparent;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .command-input::after {
      content: "";
      display: inline-block;
      width: 0.62ch;
      height: 1.05em;
      margin-left: 1px;
      transform: translateY(0.18em);
      background: var(--green);
      box-shadow: 0 0 10px rgba(50, 255, 117, 0.8);
      animation: blink 1s steps(1) infinite;
    }

    .boot {
      animation: boot-flicker 2.4s steps(2, end) 1;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @keyframes boot-flicker {
      0%, 8%, 14%, 19%, 24% {
        opacity: 0.16;
        filter: brightness(1.8);
      }

      5%, 11%, 16%, 22%, 100% {
        opacity: 1;
        filter: brightness(1);
      }
    }

    @media (max-width: 620px) {
      body {
        place-items: stretch;
      }

      .terminal-shell {
        width: 100vw;
        height: 100dvh;
        min-height: 100dvh;
        border-left: 0;
        border-right: 0;
      }

      .terminal-bar {
        height: 38px;
        padding: 0 12px;
        font-size: 12px;
      }

      .terminal {
        height: calc(100% - 38px);
        padding: 16px 14px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main class="terminal-shell boot" aria-label="Retro terminal portfolio">
    <header class="terminal-bar">
      <div>SYS/PORTFOLIO/1997</div>
      <div class="status-lights" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </header>

    <section class="terminal" id="terminal" role="application" aria-label="Interactive terminal">
      <div id="output"></div>
      <div class="prompt-row" id="promptRow">
        <span class="prompt">guest@portfolio:~$</span>
        <span
          id="commandInput"
          class="command-input"
          role="textbox"
          aria-label="Terminal command input"
          aria-multiline="false"
          contenteditable="true"
          spellcheck="false"
          autocomplete="off"
        ></span>
      </div>
    </section>
  </main>

  <script>
    const terminal = document.querySelector("#terminal");
    const output = document.querySelector("#output");
    const input = document.querySelector("#commandInput");
    const promptRow = document.querySelector("#promptRow");
    const promptText = "guest@portfolio:~$";

    let audioContext;
    const commandHistory = [];
    let historyIndex = 0;

    const initialLines = [
      "RETROTERM v3.1.4  640K RAM OK",
      "BIOS DATE 09/17/1997",
      "",
      "Type 'ls' to list files. Type 'help' for available commands.",
      ""
    ];

    const files = [
      "portfolio",
      "about.txt",
      "contact.txt",
      "readme.md"
    ];

    function init() {
      initialLines.forEach((line) => appendLine(line, line ? "dim" : ""));
      focusInput();
      document.addEventListener("click", focusInput);
      document.addEventListener("selectionchange", keepCaretAtEnd);
    }

    function ensureAudio() {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return null;
      if (!audioContext) {
        audioContext = new AudioCtor();
      }
      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
      return audioContext;
    }

    function playKeyClick(isReturnKey = false) {
      const ctx = ensureAudio();
      if (!ctx) return;

      const now = ctx.currentTime;
      const noiseLength = isReturnKey ? 0.055 : 0.034;
      const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * noiseLength), ctx.sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < data.length; i += 1) {
        const decay = 1 - i / data.length;
        data[i] = (Math.random() * 2 - 1) * decay * decay;
      }

      const noise = ctx.createBufferSource();
      noise.buffer = buffer;

      const highpass = ctx.createBiquadFilter();
      highpass.type = "highpass";
      highpass.frequency.value = isReturnKey ? 1700 : 2300;

      const clickGain = ctx.createGain();
      clickGain.gain.setValueAtTime(isReturnKey ? 0.18 : 0.13, now);
      clickGain.gain.exponentialRampToValueAtTime(0.001, now + noiseLength);

      const tick = ctx.createOscillator();
      tick.type = "square";
      tick.frequency.setValueAtTime(isReturnKey ? 920 : 1350 + Math.random() * 160, now);

      const tickGain = ctx.createGain();
      tickGain.gain.setValueAtTime(isReturnKey ? 0.06 : 0.045, now);
      tickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.018);

      noise.connect(highpass);
      highpass.connect(clickGain);
      clickGain.connect(ctx.destination);

      tick.connect(tickGain);
      tickGain.connect(ctx.destination);

      noise.start(now);
      noise.stop(now + noiseLength);
      tick.start(now);
      tick.stop(now + 0.018);
    }

    function focusInput() {
      input.focus({ preventScroll: true });
      keepCaretAtEnd();
    }

    function keepCaretAtEnd() {
      if (document.activeElement !== input) return;
      const range = document.createRange();
      const selection = window.getSelection();
      range.selectNodeContents(input);
      range.collapse(false);
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function appendLine(text = "", className = "") {
      const line = document.createElement("div");
      line.className = className ? `line ${className}` : "line";
      line.textContent = text;
      output.appendChild(line);
      scrollToBottom();
      return line;
    }

    function appendHtmlLine(html, className = "") {
      const line = document.createElement("div");
      line.className = className ? `line ${className}` : "line";
      line.innerHTML = html;
      output.appendChild(line);
      scrollToBottom();
      return line;
    }

    function appendCommand(command) {
      appendLine(`${promptText} ${command}`);
    }

    function appendFileList() {
      const wrapper = document.createElement("div");
      wrapper.className = "files";
      files.forEach((file) => {
        const item = document.createElement("span");
        item.textContent = file;
        wrapper.appendChild(item);
      });
      output.appendChild(wrapper);
      scrollToBottom();
    }

    function typeLine(text, className = "", speed = 44) {
      return new Promise((resolve) => {
        const line = appendLine("", className);
        let i = 0;
        const timer = window.setInterval(() => {
          line.textContent += text.charAt(i);
          playKeyClick(false);
          i += 1;
          scrollToBottom();
          if (i >= text.length) {
            window.clearInterval(timer);
            resolve();
          }
        }, speed);
      });
    }

    async function runCommand(rawCommand) {
      const command = rawCommand.trim().toLowerCase();
      appendCommand(rawCommand);

      if (command) {
        commandHistory.push(rawCommand);
        historyIndex = commandHistory.length;
      }

      switch (command) {
        case "":
          break;
        case "ls":
        case "dir":
          appendFileList();
          break;
        case "portfolio":
        case "./portfolio":
          input.contentEditable = "false";
          await typeLine("types coming soon", "amber", 64);
          input.contentEditable = "true";
          focusInput();
          break;
        case "about":
        case "cat about.txt":
          appendLine("Builder, designer, and terminal enjoyer.", "dim");
          break;
        case "contact":
        case "cat contact.txt":
          appendLine("contact: hello@example.com", "dim");
          break;
        case "help":
          appendLine("commands: ls, portfolio, cat about.txt, cat contact.txt, clear", "dim");
          break;
        case "clear":
          output.innerHTML = "";
          break;
        default:
          appendHtmlLine(`<span class="error">command not found:</span> ${escapeHtml(rawCommand)}`);
      }
    }

    function escapeHtml(value) {
      return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function setInput(value) {
      input.textContent = value;
      keepCaretAtEnd();
    }

    function scrollToBottom() {
      terminal.scrollTop = terminal.scrollHeight;
    }

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        const command = input.textContent.replace(/\n/g, "");
        setInput("");
        playKeyClick(true);
        runCommand(command);
        return;
      }

      if (event.key === "ArrowUp") {
        event.preventDefault();
        if (commandHistory.length) {
          historyIndex = Math.max(0, historyIndex - 1);
          setInput(commandHistory[historyIndex] || "");
        }
        return;
      }

      if (event.key === "ArrowDown") {
        event.preventDefault();
        if (commandHistory.length) {
          historyIndex = Math.min(commandHistory.length, historyIndex + 1);
          setInput(commandHistory[historyIndex] || "");
        }
        return;
      }

      if (event.ctrlKey || event.metaKey || event.altKey) return;
      if (event.key.length === 1 || event.key === "Backspace" || event.key === "Delete" || event.key === "Tab") {
        if (event.key === "Tab") event.preventDefault();
        playKeyClick(false);
      }
    });

    input.addEventListener("paste", (event) => {
      event.preventDefault();
      const text = event.clipboardData.getData("text/plain").replace(/[\r\n]+/g, " ");
      document.execCommand("insertText", false, text);
    });

    promptRow.addEventListener("click", focusInput);
    terminal.addEventListener("click", focusInput);

    init();
  </script>
</body>
</html>
