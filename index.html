<!-- Full updated index.html with Firebase terminal commands -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal Portfolio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020403;
      --panel: #061009;
      --green: #32ff75;
      --green-dim: #12a14a;
      --green-soft: rgba(50, 255, 117, 0.14);
      --amber: #ffd166;
      --red: #ff5c5c;
      --font: "Courier New", Courier, monospace;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 40%, rgba(31, 95, 45, 0.14), transparent 44%),
        linear-gradient(180deg, #000 0%, var(--bg) 100%);
      color: var(--green);
      font-family: var(--font);
    }

    .terminal-shell {
      width: min(980px, calc(100vw - 32px));
      height: min(680px, calc(100vh - 32px));
      border: 2px solid var(--green-dim);
      background: rgba(2, 9, 4, 0.94);
      box-shadow: 0 0 32px rgba(50,255,117,0.2);
    }

    .terminal-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 42px;
      padding: 0 18px;
      border-bottom: 1px solid var(--green-dim);
    }

    .terminal {
      height: calc(100% - 42px);
      padding: 22px;
      overflow: auto;
      font-size: 16px;
      line-height: 1.5;
    }

    .line { white-space: pre-wrap; }
    .dim { opacity: 0.8; }
    .amber { color: var(--amber); }
    .error { color: var(--red); }

    .prompt-row {
      display: flex;
      align-items: baseline;
    }

    .command-input {
      flex: 1;
      padding-left: 1ch;
      outline: none;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main class="terminal-shell">
    <header class="terminal-bar">
      <div>SYS/PORTFOLIO/1997</div>
      <div>ONLINE</div>
    </header>

    <section class="terminal" id="terminal">
      <div id="output"></div>
      <div class="prompt-row" id="promptRow">
        <span>guest@portfolio:~$</span>
        <span id="commandInput" class="command-input" contenteditable="true" spellcheck="false"></span>
      </div>
    </section>
  </main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-functions.js";
import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
      apiKey: "AIzaSyD0zXn1A0xPWiavXIcRf0xxmK-LD0A6TSU",
      authDomain: "kexgh-terminal.firebaseapp.com",
      projectId: "kexgh-terminal",
      storageBucket: "kexgh-terminal.firebasestorage.app",
      messagingSenderId: "877115716564",
      appId: "1:877115716564:web:aa94b9f9aec6f1fcbe9c41"
    };

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const functions = getFunctions(app, "us-central1");
const db = getFirestore(app);

const terminal = document.querySelector("#terminal");
const output = document.querySelector("#output");
const input = document.querySelector("#commandInput");

function appendLine(text = "", className = "") {
  const line = document.createElement("div");
  line.className = className ? `line ${className}` : "line";
  line.textContent = text;
  output.appendChild(line);
  terminal.scrollTop = terminal.scrollHeight;
}

function focusInput() {
  input.focus();
}

async function ensureFirebaseUser() {
  if (!auth.currentUser) {
    await signInAnonymously(auth);
  }
}

async function registerCtfUsername(username) {
  await ensureFirebaseUser();
  const fn = httpsCallable(functions, "registerUsername");
  const result = await fn({ username });
  return result.data.message;
}

async function submitCtfFlag(flag) {
  await ensureFirebaseUser();
  const fn = httpsCallable(functions, "submitFlag");
  const result = await fn({ flag });
  return result.data.message;
}

async function getCtfLeaderboard() {
  const q = query(collection(db, "users"), orderBy("score", "desc"), limit(10));
  const snapshot = await getDocs(q);

  if (snapshot.empty) return "No players yet.";

  return snapshot.docs
    .map((doc, i) => {
      const data = doc.data();
      return `${i + 1}. ${data.username} — ${data.score} pts`;
    })
    .join("\n");
}

async function runCommand(rawCommand) {
  const command = rawCommand.trim();
  const lower = command.toLowerCase();

  appendLine(`guest@portfolio:~$ ${command}`);

  if (!command) return;

  if (lower.startsWith("register ")) {
    const username = command.split(/\s+/)[1];
    try {
      appendLine(await registerCtfUsername(username), "amber");
    } catch (e) {
      appendLine(`register error: ${e.message}`, "error");
    }
    return;
  }

  if (lower.startsWith("submit ")) {
    const flag = command.slice(7);
    try {
      appendLine(await submitCtfFlag(flag), "amber");
    } catch (e) {
      appendLine(`submit error: ${e.message}`, "error");
    }
    return;
  }

  switch (lower) {
    case "help":
      appendLine("commands: help, ls, clear, register <name>, submit <flag>, leaderboard, flags, sudo su", "dim");
      break;

    case "ls":
      appendLine("portfolio\nabout.txt\ncontact.txt\n.secret.txt", "dim");
      break;

    case "flags":
      appendLine("20 flags available", "dim");
      appendLine("Easy: 10 | Medium: 5 | Hard: 5", "dim");
      appendLine("Use: submit FLAG{example}", "dim");
      break;

    case "leaderboard":
      try {
        appendLine(await getCtfLeaderboard(), "amber");
      } catch (e) {
        appendLine(`leaderboard error: ${e.message}`, "error");
      }
      break;

    case "sudo su":
      appendLine("Access denied.", "error");
      appendLine("FLAG{you_tried_root}", "amber");
      break;

    case "clear":
      output.innerHTML = "";
      break;

    default:
      appendLine(`command not found: ${command}`, "error");
  }
}

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    const command = input.textContent.replace(/\n/g, "");
    input.textContent = "";
    runCommand(command);
  }
});

appendLine("RETROTERM v3.1.4  640K RAM OK", "dim");
appendLine("Type 'help' for available commands.", "dim");
appendLine("");
focusInput();
</script>
</body>
</html>
